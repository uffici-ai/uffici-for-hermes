# The plugin's release — built HERE, in the public repository, from the tag.
#
# Hermes loads a plugin by copying one directory into its plugin folder, so
# the release is a source tarball, not a wheel: `uffici-for-hermes.tar.gz`
# holding `uffici-for-hermes/` — the package directory (`src/uffici_for_hermes`,
# with `plugin.yaml` inside it), the install manifest `uffici-plugin.json`
# stamped with this version, and the license files. `uffici setup` fetches it
# from `releases/latest/download/`, so the name carries no version.
#
# No secret beyond the repository's own token: the signature is keyless
# (Sigstore, this run's OIDC identity) and the provenance is GitHub's attestation.
name: Release

# 🔴 Tags only: a dispatch from a branch would create a release named after
# the branch, which `releases/latest` would then hand to every installer.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - name: Check
        run: uv run --frozen ruff check . && uv run --frozen pytest
      - name: Package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          stage="$(mktemp -d)/uffici-for-hermes"
          mkdir -p "$stage"
          cp -R src/uffici_for_hermes/. "$stage/"
          rm -rf "$stage/__pycache__"
          find "$stage" -name '__pycache__' -type d -prune -exec rm -rf {} +
          cp LICENSE NOTICE README.md "$stage/"
          # The manifest, with this release's version in place of the tracked 0.0.0.
          python3 - "$version" "$stage/uffici-plugin.json" <<'PY'
          import json, sys
          version, out = sys.argv[1], sys.argv[2]
          with open("uffici-plugin.json", encoding="utf-8") as f:
              manifest = json.load(f)
          manifest["version"] = version
          with open(out, "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          PY
          mkdir -p dist
          tar -C "$(dirname "$stage")" -czf dist/uffici-for-hermes.tar.gz uffici-for-hermes
          (cd dist && sha256sum uffici-for-hermes.tar.gz > checksums.txt)
          tar -tzf dist/uffici-for-hermes.tar.gz | sort
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # cosign v3 writes a Sigstore bundle, which `verify-blob --bundle` reads.
      - name: Sign
        run: cosign sign-blob --yes --bundle dist/uffici-for-hermes.tar.gz.sigstore.json dist/uffici-for-hermes.tar.gz
      - name: Attest
        # 🔴 Only once the repository is public: GitHub persists a build
        # attestation for public repositories (or a plan that includes them),
        # and a private-phase release must still complete — the checksum list
        # and the signature bundle need no such feature (#2196).
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/uffici-for-hermes.tar.gz
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          pin="$(grep -oE 'Hermes [0-9]+\.[0-9]+\.[0-9]+' README.md | head -n 1 || true)"
          notes="Uffici for Hermes ${TAG}, written against ${pin:-the Hermes version named in README.md}.

          Verify before you install:

          \`\`\`sh
          cosign verify-blob --bundle uffici-for-hermes.tar.gz.sigstore.json \\
            --certificate-identity-regexp 'https://github.com/uffici-ai/uffici-for-hermes/' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com uffici-for-hermes.tar.gz
          \`\`\`"
          # 🔴 A tag with a hyphen (`v0.9.0-rc.1`, `v0.10.0-dev.4`) is a
          # PRERELEASE: `releases/latest` skips prereleases, and it is what
          # install.sh and `uffici setup` fall back to, so an rc or a dev train
          # must never become every installer's latest. The companion does the
          # same through goreleaser's `prerelease: auto`.
          prerelease=()
          if [[ "$TAG" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$TAG" --title "$TAG" --notes "$notes" "${prerelease[@]}" \
            dist/uffici-for-hermes.tar.gz dist/checksums.txt dist/uffici-for-hermes.tar.gz.sigstore.json
