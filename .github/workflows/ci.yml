# The plugin's own CI — a thin caller of this project's `check` entry.
#
# 🔴 It does NOT run in the platform repository: the workflow travels with the
# subtree so the mirrored repository proves the project builds standalone, which
# is the whole claim the `uffici/` fence makes. On the platform side the same
# check runs through `pnpm check:uffici --only uffici-for-hermes`, from the
# `uffici-for-hermes` job in that repository's `pr.yml`.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned by SHA: this project's toolchain is what the check is a
      # statement about, so a floating tag would move it without a diff of ours.
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - name: Check
        run: uv run --frozen ruff check . && uv run --frozen pytest

# The end-to-end conversation is NOT here: it needs a companion, which is a
# different project in a different repository. `e2e.yml` runs it against the
# companion's RELEASED image by version — the gate on a release — and
# `lint-docs.yml` runs the Markdown and spelling configs, which need Node and so
# stay out of this single-toolchain check.
